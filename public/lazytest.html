<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Poster loading test</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; padding: 14px; background: #111; color: #eee;
             font: 15px/1.45 -apple-system, system-ui, sans-serif; }
      h1 { font-size: 17px; margin: 0 0 6px; }
      p { margin: 0 0 12px; color: #999; font-size: 13px; }
      button { font: inherit; font-weight: 600; padding: 12px 20px; border: 0; border-radius: 8px;
               background: #f5c518; color: #111; }
      button[disabled] { opacity: 0.4; }
      #back { display: inline-block; margin-bottom: 14px; color: #f5c518; text-decoration: none;
              font-size: 14px; font-weight: 600; }
      #status { margin: 12px 0 0; font-weight: 600; min-height: 20px; }
      #verdict:not(:empty) { margin-top: 12px; padding: 12px; border-radius: 8px; background: #1d1d1d;
                             border-left: 3px solid #f5c518; font-size: 14px; }
      #out { white-space: pre; overflow-x: auto; font: 12px/1.5 ui-monospace, Menlo, monospace;
             background: #000; padding: 10px; border-radius: 8px; margin-top: 12px; }
      #out:empty { display: none; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px;
              margin-top: 14px; }
      #grid img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #333;
                  border-radius: 4px; display: block; }
    </style>
  </head>
  <body>
    <a id="back" href="index.html#/settings">‹ Back to WatchWhat</a>
    <h1>Poster loading test</h1>
    <p>
      Four runs of ~11s. Keep it in the foreground and don't scroll. Downloads ~50 MB of
      deliberately oversized posters, so use wifi.
    </p>
    <button id="go">Run test</button>
    <div id="status"></div>
    <div id="verdict"></div>
    <div id="out"></div>
    <div id="grid"></div>

    <script>
      // Opening WatchWhat after 12+ hours starts a bulk TMDB refresh, and every result it streams
      // in rebuilds the grid — one replaceChildren per 300ms for as long as the refresh runs.
      // Posters that are already loaded sail through that untouched; measured on Chrome and on
      // the phone, that one is ruled out. This measures the state a cold relaunch is in, where no
      // poster is loaded yet.
      //
      // Both TMDB hosts speak HTTP/1.1, so the browser will only run six requests at a time and
      // everything else waits in a queue. In Chrome, a lazy image that is still *in* that queue
      // gets sent back to the end of it every time the grid is rebuilt, so it never starts:
      // 2 of 40 arrived during the churn against 12 left alone, and they all landed together the
      // moment it stopped. Eager images were untouched. That is the reported symptom exactly.
      //
      // Which is why the posters here are full-size originals: the effect needs a queue that
      // takes longer to drain than the gap between rebuilds, and w342 posters on wifi drain
      // instantly. Arms C and D are the two candidate fixes, so one run settles the remedy too.

      const PATHS = [
        "/oKxBWbXmnWFO2Wh1QRTtshdfIRa.jpg", "/hr5aLuCdLC5X423c9G1pPkWR6Ud.jpg",
        "/3wB4R3Ac3lKSQWKpoU0zeRY8XqL.jpg", "/uWpG7GqfKGQqX4YMAo3nv5OrglV.jpg",
        "/ztkUQFLlC19CCMYHW9o1zWhJRNq.jpg", "/1XS1oqL89opfnbLl8WnZY1O1uJx.jpg",
        "/q8dWfc4JwQuv3HayIZeO84jAXED.jpg", "/k5Qg5rgPoKdh3yTJJrLtyoyYGwC.jpg",
        "/ekaa7YjGPTkFLcPhwWXTnARuCEU.jpg", "/2NhBFUTg5KVBmGwafxtLwVdsqrr.jpg",
        "/ie1quhMk09lDtvtAyQAHTu09R9Z.jpg", "/hvGugwL2mu3rpbFy001pe0ZBuk.jpg",
      ];
      const COUNT = 48;
      const REBUILD_MS = 300;   // batchNotify's throttle, src/data/sync.ts
      const SLOW_REBUILD_MS = 2000;
      const CHURN_MS = 7000;
      const TOTAL_MS = 11000;

      const grid = document.getElementById("grid");
      const out = document.getElementById("out");
      const status = document.getElementById("status");
      const verdict = document.getElementById("verdict");
      const go = document.getElementById("go");

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      async function arm(label, { rebuildMs, lazy }) {
        // Fresh query string per arm so every run starts with an empty cache.
        const tag = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        const nodes = Array.from({ length: COUNT }, (_, i) => {
          const img = document.createElement("img");
          if (lazy) img.loading = "lazy";
          img.alt = "";
          img.src = `https://image.tmdb.org/t/p/original${PATHS[i % PATHS.length]}?b=${tag}-${i}`;
          return img;
        });
        grid.replaceChildren(...nodes);
        scrollTo(0, 0);

        const inView = () =>
          nodes.filter((n) => {
            const r = n.getBoundingClientRect();
            return r.bottom > 0 && r.top < innerHeight;
          });
        const loaded = (list) => list.filter((n) => n.complete && n.naturalWidth > 0).length;

        const series = [];
        let rebuilds = 0;
        const sampler = setInterval(() => series.push(loaded(inView())), 1000);
        const rebuilder = rebuildMs
          ? setInterval(() => {
              rebuilds++;
              // Exactly what renderContent does: empty the grid, then put the same nodes back.
              grid.replaceChildren();
              grid.replaceChildren(...nodes);
            }, rebuildMs)
          : null;

        await sleep(CHURN_MS);
        if (rebuilder) clearInterval(rebuilder);
        const visible = inView().length;
        const atChurnEnd = loaded(inView());
        await sleep(TOTAL_MS - CHURN_MS);
        clearInterval(sampler);
        const atEnd = loaded(inView());

        out.textContent +=
          `${label.padEnd(20)} ${String(atChurnEnd).padStart(2)}/${visible} at ${CHURN_MS / 1000}s, ` +
          `${String(atEnd).padStart(2)}/${visible} at ${TOTAL_MS / 1000}s   (${rebuilds} rebuilds)\n` +
          `  up each second: ${series.join(" ")}\n`;
        return { label, visible, atChurnEnd, atEnd };
      }

      go.addEventListener("click", async () => {
        go.disabled = true;
        out.textContent = "";
        verdict.textContent = "";
        const arms = [
          ["A left alone", { rebuildMs: 0, lazy: true }],
          ["B rebuilt at 300ms", { rebuildMs: REBUILD_MS, lazy: true }],
          ["C same, not lazy", { rebuildMs: REBUILD_MS, lazy: false }],
          ["D rebuilt at 2s", { rebuildMs: SLOW_REBUILD_MS, lazy: true }],
        ];
        const results = [];
        for (let i = 0; i < arms.length; i++) {
          status.textContent = `Running ${i + 1} of 4: ${arms[i][0]}…`;
          results.push(await arm(arms[i][0], arms[i][1]));
          await sleep(800);
        }
        grid.replaceChildren();
        status.textContent = "Done.";

        const [a, b, c, d] = results;
        const starved = b.atChurnEnd < a.atChurnEnd / 2;
        const fixes = [];
        if (c.atChurnEnd >= a.atChurnEnd * 0.8) fixes.push('dropping loading="lazy"');
        if (d.atChurnEnd >= a.atChurnEnd * 0.8) fixes.push("rebuilding every 2s instead of 300ms");
        verdict.textContent = starved
          ? `CONFIRMED: rebuilding starves posters still waiting to load — ${b.atChurnEnd} of ` +
            `${b.visible} arrived against ${a.atChurnEnd} left alone. ` +
            (fixes.length ? `Fixed by ${fixes.join(", and by ")}.` : `Neither candidate fix helped.`)
          : `NOT reproduced: ${b.atChurnEnd} of ${b.visible} arrived while rebuilding, against ` +
            `${a.atChurnEnd} left alone. If arm A also finished instantly, the connection is too ` +
            `fast for this to show — the queue never builds up.`;
        go.disabled = false;
      });
    </script>
  </body>
</html>
